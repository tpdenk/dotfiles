# palette mirrors lookandfeel.lua
$color = rgba(1a1b26ff)
$inner_color = rgba(1a1b26cc)
$outer_color = rgba(7aa2f7ff)
$font_color = rgba(c0caf5ff)
$check_color = rgba(bb9af7ff)

general {
	hide_cursor = true
	ignore_empty_input = true
	fail_timeout = 1000
}

auth {
	fingerprint:enabled = true
}

animations {
	bezier = linear, 1, 1, 0, 0
	animation = fadeIn, 1, 2, linear
	animation = fadeOut, 1, 1, linear
}

background {
	monitor = 
	color = $color
	path = ~/.config/hypr/assets/wallpaper.jpeg
	blur_passes = 3
}

input-field {
	monitor = 
	size = 800, 80
	position = 0, 0
	halign = center
	valign = center

	inner_color = $inner_color
	outer_color = $outer_color
	outline_thickness = 3
	
	font_family = Berkeley Mono
	font_color = $font_color	

	placeholder_text = password
	check_color = $check_color
	fail_text = $FAIL ($ATTEMPTS)
	
	rounding = 2
	shadow_passes = 2
	fade_on_empty = true
}