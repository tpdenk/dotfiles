# Tokyo Night (night)
$bg = rgb(1a1b26)
$bg_storm = rgb(24283b)
$bg_highlight = rgb(292e42)
$fg = rgb(c0caf5)
$fg_dark = rgb(a9b1d6)
$comment = rgb(565f89)
$blue = rgb(7aa2f7)
$cyan = rgb(7dcfff)
$magenta = rgb(bb9af7)
$red = rgb(f7768e)
$orange = rgb(ff9e64)

# roles, named after hyprtoolkit's keys
$background = $bg
$base = $bg_storm
$alternate_base = $bg_highlight
$text = $fg_dark
$bright_text = $fg
$link_text = $cyan
$accent = $blue
$accent_secondary = $magenta
# not a hyprtoolkit key: placeholders, inactive workspaces, inactive borders
$muted = $comment
# not hyprtoolkit keys either: the screen recorder's countdown and its
# running indicator
$warning = $orange
$alert = $red

$rounding_large = 8
$rounding_small = 4
$window_rounding = 2
$border_size = 2

$font_family = BerkeleyMono Nerd Font Mono
$font_family_monospace = BerkeleyMono Nerd Font Mono
$font_size = 11
$small_font_size = 10
$h1_size = 19
$h2_size = 15
$h3_size = 13
