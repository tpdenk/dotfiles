general {
	lock_cmd = pidof hyprlock || hyprlock
	before_sleep_cmd = loginctl lock-session
	after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 15 min idle: lock, or suspend when the lock screen has already sat idle that
# long (a manual lock with no input since)
listener {
	timeout = 900
	on-timeout = if pidof hyprlock >/dev/null; then systemctl suspend; else loginctl lock-session; fi
}

# 15 min on the lock screen the listener above raised: suspend
listener {
	timeout = 1800
	on-timeout = systemctl suspend
}
