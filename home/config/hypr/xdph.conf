screencopy {
    max_fps = 60
    custom_picker_binary = /home/tpdenk/.local/bin/share-picker
    # no restore tokens, ever: a client holding one is never asked again, and
    # every share it restores renews it. share-picker refuses them too, so this
    # staying false is belt and braces.
    allow_token_by_default = false
    cursor_mode = 2
}
