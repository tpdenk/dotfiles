# hyprtoolkit theme; every value comes from theme.conf.
# Absolute path on purpose: hyprtoolkit 0.5.4 resolves relative `source` against cwd.
source = ~/.config/hypr/theme.conf

background = $background
base = $base
alternate_base = $alternate_base
text = $text
bright_text = $bright_text
link_text = $link_text
accent = $accent
accent_secondary = $accent_secondary

rounding_large = $rounding_large
rounding_small = $rounding_small

font_family = $font_family
font_family_monospace = $font_family_monospace
font_size = $font_size
small_font_size = $small_font_size
h1_size = $h1_size
h2_size = $h2_size
h3_size = $h3_size
