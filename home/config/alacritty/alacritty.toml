[env]
TERM = "xterm-256color"

[font]
normal = { family = "BerkeleyMono Nerd Font Mono" }
bold = { family = "BerkeleyMono Nerd Font Mono" }
italic = { family = "BerkeleyMono Nerd Font Mono" }
size = 9

[window]
padding.x = 14
padding.y = 14
decorations = "None"

[terminal]
osc52 = "CopyPaste"

[keyboard]
bindings = [
  # Ctrl+Backspace -> send Alt+Backspace (ESC DEL) so shells delete the previous word
  { key = "Backspace", mods = "Control", chars = "\u001B\u007F" },
]
